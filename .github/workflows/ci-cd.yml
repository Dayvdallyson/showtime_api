name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck e smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: showtime
          POSTGRES_PASSWORD: showtime
          POSTGRES_DB: showtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U showtime -d showtime"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://showtime:showtime@localhost:5432/showtime?schema=public
      PORT: 3333
      WEB_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Aplicar migrations
        run: pnpm prisma migrate deploy

      - name: Seed
        run: pnpm db:seed

      - name: Smoke test
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3333/health && break
            sleep 1
          done
          curl -sf http://localhost:3333/health | grep -q '"ok":true'
          test "$(curl -sf http://localhost:3333/movies | grep -o '"id"' | wc -l)" -eq 8
          id=$(curl -sf -X POST http://localhost:3333/movies \
            -H "Content-Type: application/json" \
            -d '{"title":"CI","genre":"Teste","year":2026}' | sed -E 's/.*"id":"([^"]+)".*/\1/')
          curl -sf -X PATCH "http://localhost:3333/movies/$id" \
            -H "Content-Type: application/json" -d '{"year":2025}' | grep -q '"year":2025'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "http://localhost:3333/movies/$id")" = 204
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3333/movies/$id")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3333/movies \
            -H "Content-Type: application/json" -d '{}')" = 400

  docker:
    name: Publicar imagem no GHCR
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/showtime_api
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
